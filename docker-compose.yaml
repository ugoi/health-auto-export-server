name: healthyapps

services:
  hae-mongo:
    container_name: hae-mongo
    image: mongodb/mongodb-community-server:8.0.12-ubuntu2204
    # Existing volume is owned by the official mongo image uid/gid.
    # The community-server image is stable here, but must run as the same uid.
    user: "999:999"
    restart: unless-stopped
    volumes:
      - mongodb-data:/data/db
    networks:
      - hae_network
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB}
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')", "--quiet"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  hae-grafana:
    container_name: hae-grafana
    image: grafana/grafana-oss:latest
    ports:
      - "127.0.0.1:3014:3000"
    volumes:
      - ./grafana-data:/var/lib/grafana
    user: "0:0"
    restart: unless-stopped
    networks:
      - hae_network
    depends_on:
      hae-mongo:
        condition: service_healthy

  hae-server:
    container_name: hae-server
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      - NODE_ENV=${NODE_ENV}
      - MONGO_HOST=${MONGO_HOST}
      - MONGO_PORT=${MONGO_PORT}
      - MONGO_DB=${MONGO_DB}
      - MONGO_USERNAME=${MONGO_USERNAME}
      - MONGO_PASSWORD=${MONGO_PASSWORD}
      - READ_TOKEN=${READ_TOKEN}
      - WRITE_TOKEN=${WRITE_TOKEN}
    depends_on:
      hae-mongo:
        condition: service_healthy
    networks:
      - hae_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  hae_network:
    driver: bridge

volumes:
  grafana-data:
  mongodb-data:
